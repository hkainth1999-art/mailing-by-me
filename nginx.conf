# ==============================================================================
# 👑 Crown Mail Vault — Nginx Reverse Proxy with SSL
# Domain: tempmail.rizzcord.site (Web UI with HTTPS)
# Inbound Mail MX: mail.rizzcord.site (Direct Port 25 SMTP)
# ==============================================================================

# 1. HTTP Server — Redirects all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tempmail.rizzcord.site mail.rizzcord.site;

    # Let's Encrypt ACME verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to secure HTTPS domain
    location / {
        return 301 https://tempmail.rizzcord.site$request_uri;
    }
}

# 2. HTTPS Server — Secure Reverse Proxy to Node.js (Port 3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tempmail.rizzcord.site;

    # SSL Certificates (Auto-generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/tempmail.rizzcord.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tempmail.rizzcord.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max message payload size
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket Upgrade for Live Inbound Stream
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Secure Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

